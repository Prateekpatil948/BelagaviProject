<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor Thank-You Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-950:#231a15;
    --stone-800:#3a2c22;
    --stone-100:#efe8dd;
    --stone-50:#f7f3ea;
    --maroon:#5A0F16;
    --maroon-deep:#3f0a0f;
    --gold:#C9A227;
    --gold-light:#E9C863;
    --ivory:#FBF3E3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #2c211a 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, #2c211a 0%, transparent 45%),
      var(--stone-950);
    color: var(--stone-100);
    min-height:100vh;
    padding: 14px 16px 20px;
  }
  .wrap{
    max-width: 1440px;
    margin: 0 auto;
  }
  header.app-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 14px;
  }
  header.app-head .mark{
    width:44px;height:44px;border-radius:10px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    box-shadow: 0 4px 14px rgba(201,162,39,0.35);
  }
  header.app-head h1{
    font-size: 20px;
    font-weight:600;
    letter-spacing:.2px;
    color: var(--stone-50);
  }
  header.app-head p{
    font-size:12.5px;
    color:#c9bfae;
    margin-top:2px;
  }

  .layout{
    display:grid;
    grid-template-columns: minmax(290px, 330px) minmax(420px, 1fr);
    gap: 22px;
    align-items:start;
  }
  @media (max-width: 1100px){
    .layout{ grid-template-columns: minmax(290px, 350px) 1fr; }
  }
  @media (max-width: 700px){
    .layout{ grid-template-columns: 1fr; }
    .entry-panel{ max-height:none; overflow:visible; }
    .canvas-panel{ height:auto; }
    #cardCanvas{ width:100%; max-height:none; }
  }

  .panel{
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
  }

  .field{ margin-bottom:9px; }
  .field label{
    display:block;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#c9bfae;
    margin-bottom:5px;
    font-weight:600;
  }
  input[type=text], input[type=number], input[type=date]{
    width:100%;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04);
    color: var(--stone-50);
    font-size:13px;
    font-family:'Poppins',sans-serif;
    outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus{
    border-color: var(--gold);
    background: rgba(255,255,255,0.06);
  }
  .payment-options{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  .field .payment-option{
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin-bottom:0; min-height:48px; text-align:center; line-height:1.45;
    padding:8px; border:1px solid rgba(255,255,255,0.14); border-radius:10px;
    color:var(--stone-50); font-size:12px; cursor:pointer;
  }
  .payment-option:has(input:checked){ border-color:var(--gold); background:rgba(201,162,39,.12); }
  .payment-option input{ accent-color:var(--gold); margin:0; flex-shrink:0; }
  .payment-option span{ min-width:0; }
  .field .payment-option:has(input[name="paymentMethod"]){
    display:grid;
    grid-template-columns:14px minmax(0, 1fr) 14px;
    min-height:48px;
  }
  .payment-option:has(input[name="paymentMethod"]) span{
    grid-column:2;
    text-align:center;
  }
  .payment-options:has(input[name="purpose"]){ grid-auto-rows:1fr; }

  .btn-primary{
    width:100%;
    padding:10px;
    border-radius:11px;
    border:none;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color:#2b2007;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    letter-spacing:.02em;
    font-family:'Poppins',sans-serif;
  }
  .btn-primary:active{ transform: translateY(1px); }
  .canvas-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    height: calc(100vh - 126px);
    justify-content:center;
  }
  #cardCanvas{
    width:auto;
    max-width: 600px;
    max-height: calc(100vh - 180px);
    max-width:100%;
    height:auto;
    border-radius: 10px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.55);
  }
  .status-note{
    font-size:12px;
    color:#a89c86;
  }

</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="mark">🙏</div>
    <div>
      <h1>Donor Thank-You Card Generator</h1>
    </div>
  </header>

  <div class="layout">
    <div class="panel entry-panel">
      <div class="field">
        <label for="receiptNo">Receipt no *</label>
        <input type="number" id="receiptNo" min="0" step="1" inputmode="numeric" placeholder="e.g. 1001" required>
      </div>

      <div class="field">
        <label for="donorName">Donor name *</label>
        <input type="text" id="donorName" placeholder="e.g. Suresh Kumar Jain" required>
      </div>

      <div class="field">
        <label for="village">Village</label>
        <input type="text" id="village" placeholder="e.g. Belagavi">
      </div>

      <div class="field">
        <label id="purposeLabel">Contribution towards</label>
        <div class="payment-options" role="radiogroup" aria-labelledby="purposeLabel">
          <label class="payment-option"><input type="radio" name="purpose" value="hostel building fund" checked> <span>hostel building fund</span></label>
          <label class="payment-option"><input type="radio" name="purpose" value="student Adoption"> <span>student Adoption</span></label>
          <label class="payment-option"><input type="radio" name="purpose" value="wealth food donations"> <span>wealth food donations</span></label>
          <label class="payment-option"><input type="radio" name="purpose" value="Other purpose"> <span>Other purpose</span></label>
        </div>
      </div>

      <div class="field">
        <label for="donorAmount">Donation amount (optional)</label>
        <input type="text" id="donorAmount" inputmode="numeric" placeholder="e.g. 5000">
      </div>

      <div class="field">
        <label>Mode of payment</label>
        <div class="payment-options" role="radiogroup" aria-label="Mode of payment">
          <label class="payment-option"><input type="radio" name="paymentMethod" value="Cash"> <span>Cash</span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="UPI"> <span>UPI</span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="Cheque"> <span>Cheque</span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="Net banking"> <span>Net banking</span></label>
        </div>
      </div>

      <div class="field">
        <label for="donationDate">Date of donation</label>
        <input type="date" id="donationDate">
      </div>

      <button class="btn-primary" id="downloadBtn">⬇ Download Card</button>
    </div>

    <div class="panel canvas-panel">
      <canvas id="cardCanvas" width="1300" height="1794"></canvas>
      <div class="status-note" id="statusNote">Preview updates as you type.</div>
    </div>

  </div>
</div>

<script>
const TEMPLE_PHOTO = "Background.png";
const LOGO_PHOTO = "first_image.jpg";

const COPY = {
  en: {
    trustLine: "Shree Bhagawan Mahaveer\nSiddhayatan",
    invocation: "|| Shree Veetaragay Namah ||",
    title: "THANK YOU",
    subtitle: "Heartfelt gratitude for your generous donation",
    defaultPurpose: "hostel building fund",
    messages: [
      (name) => [
        `Dear ${name}, thank you sincerely for your generous contribution towards `,
        `. Your support strengthens our temple and community. May Bhagawan Mahaveer bless you and your family with good health, peace, and prosperity.`
      ],
      (name) => [
        `Dear ${name}, we are grateful for your thoughtful donation towards `,
        `. Your kindness helps us serve our community with care and dedication. May you and your family be blessed with happiness and good health.`
      ],
      (name) => [
        `Dear ${name}, please accept our heartfelt thanks for supporting `,
        `. Your generosity brings hope and encouragement to our work. May Bhagawan Mahaveer bless you and your loved ones with peace and prosperity.`
      ],
      (name) => [
        `Dear ${name}, your generous contribution towards `,
        ` is deeply appreciated. Your support helps us continue our service and make a positive difference in our community. We wish you and your family joy, harmony, and good health.`
      ],
      (name) => [
        `Dear ${name}, thank you for sharing your kindness through a donation towards `,
        `. Your thoughtful support inspires us to carry our work forward with renewed commitment. May your family be blessed with peace, happiness, and prosperity.`
      ]
    ],
    footerAddr: "Jain Yuvak Mandal Trust\n55; Hindwadi Belgaum Karnataka\nPin no 590011\nPhone no 0831-2425585, 9110292365",
    dharma: "|| Ahimsa Paramo Dharmah ||",
    namePrefix: "",
    dateLabel: "Date of Donation ",
    amountLabel: "Donation",
  },
};

const CARD_PALETTES = [
  { name: 'Maroon & Gold', background: '#FBF3E3', border: '#A9791F', ink: '#6E1420', primary: '#5A0F16', title: '#7A1218', muted: '#3A2A17', soft: '#F3D998', accent: '#C9A227', text: '#2E2116' },
  { name: 'Royal Blue', background: '#F2F6FF', border: '#A88945', ink: '#213F78', primary: '#18335F', title: '#234C91', muted: '#35445F', soft: '#DEE8FA', accent: '#B99548', text: '#253247' },
  { name: 'Teal', background: '#F0FAFA', border: '#77A5A6', ink: '#175B63', primary: '#124951', title: '#196D77', muted: '#36585D', soft: '#D1ECEC', accent: '#68A6AA', text: '#243E43' },
  { name: 'Plum', background: '#FCF4FC', border: '#AF8B53', ink: '#673568', primary: '#522650', title: '#783D77', muted: '#59415B', soft: '#EEDDEF', accent: '#BB9859', text: '#402C42' },
  { name: 'Charcoal & Gold', background: '#FAF7F0', border: '#AA8744', ink: '#34363C', primary: '#292B30', title: '#41434A', muted: '#55534D', soft: '#EDE1C7', accent: '#C3A05B', text: '#303136' }
];

let state = {
  paletteIndex: Math.floor(Math.random() * CARD_PALETTES.length),
  messageIndex: Math.floor(Math.random() * COPY.en.messages.length),
  receiptNo: '',
  nameRaw: '',
  name: '',
  village: '',
  purpose: COPY.en.defaultPurpose,
  amount: '',
  paymentMethod: '',
  date: localTodayISO(),
};

function localTodayISO() {
  const now = new Date();
  const offset = now.getTimezoneOffset() * 60000;
  return new Date(now.getTime() - offset).toISOString().slice(0, 10);
}

function formatDate(dateValue, locale, options) {
  if (!dateValue) return '';
  // Add a local midday time to an input value so it never shifts by timezone.
  const date = /^\d{4}-\d{2}-\d{2}$/.test(dateValue)
    ? new Date(`${dateValue}T12:00:00`)
    : new Date(dateValue);
  return Number.isNaN(date.getTime()) ? dateValue : date.toLocaleDateString(locale, options);
}

function dateToInputValue(dateValue) {
  if (!dateValue) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) return dateValue;
  const parsed = new Date(dateValue);
  if (Number.isNaN(parsed.getTime())) return '';
  return [parsed.getFullYear(), String(parsed.getMonth() + 1).padStart(2, '0'), String(parsed.getDate()).padStart(2, '0')].join('-');
}

function formatINR(num) {
  try {
    return new Intl.NumberFormat('en-IN').format(num);
  } catch (e) {
    return String(num);
  }
}

const canvas = document.getElementById('cardCanvas');
const ctx = canvas.getContext('2d');
// Layout is designed against this logical 1000x1180 grid; the actual
// canvas is rendered larger (see width/height attributes above) and
// everything is scaled up proportionally at draw time for a
// higher-resolution card.
const W = 1000, H = 1380;
const RENDER_SCALE = canvas.width / W;

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (let w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function wrapStyledText(ctx, parts, maxWidth, fontFamily, fontSize) {
  const lines = [];
  let line = [], lineWidth = 0;
  parts.forEach(({ text, bold }) => {
    text.split(/\s+/).filter(Boolean).forEach(word => {
      ctx.font = `${bold ? 700 : 400} ${fontSize}px "${fontFamily}"`;
      const prefix = line.length ? ' ' : '';
      const token = prefix + word;
      const tokenWidth = ctx.measureText(token).width;
      if (line.length && lineWidth + tokenWidth > maxWidth) {
        lines.push(line);
        line = [];
        lineWidth = 0;
      }
      const rendered = line.length ? ' ' + word : word;
      ctx.font = `${bold ? 700 : 400} ${fontSize}px "${fontFamily}"`;
      const width = ctx.measureText(rendered).width;
      line.push({ text: rendered, bold, width });
      lineWidth += width;
    });
  });
  if (line.length) lines.push(line);
  return lines;
}

function drawStyledTextLines(ctx, lines, centerX, y, lineHeight, fontFamily, fontSize) {
  ctx.save();
  ctx.textAlign = 'left';
  lines.forEach(line => {
    const lineWidth = line.reduce((sum, token) => sum + token.width, 0);
    let x = centerX - lineWidth / 2;
    line.forEach(token => {
      ctx.font = `${token.bold ? 700 : 400} ${fontSize}px "${fontFamily}"`;
      ctx.fillText(token.text, x, y);
      x += token.width;
    });
    y += lineHeight;
  });
  ctx.restore();
  return y;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let bgTempleImg = new Image();
let bgLoaded = false;
bgTempleImg.onload = () => { bgLoaded = true; draw(); };
bgTempleImg.src = TEMPLE_PHOTO;

let logoImg = new Image();
let logoLoaded = false;
logoImg.onload = () => { logoLoaded = true; draw(); };
logoImg.src = LOGO_PHOTO;

function draw() {
  const c = COPY.en;
  const palette = CARD_PALETTES[state.paletteIndex];
  const headFont = "Cinzel";
  const bodyFont = "Poppins";

  // Reset any prior transform, clear the full (larger) physical canvas,
  // then scale up so the 1000x1180 layout below fills it crisply.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(RENDER_SCALE, RENDER_SCALE);

  // background
  ctx.fillStyle = palette.background;
  ctx.fillRect(0, 0, W, H);

  // Enlarge the watermark slightly and offset it to the left.
  if (bgLoaded) {
    const iw = bgTempleImg.naturalWidth || bgTempleImg.width;
    const ih = bgTempleImg.naturalHeight || bgTempleImg.height;
    const watermarkArea = { x: 50, y: 240, width: W - 100, height: H - 440 };
    const scale = Math.min(watermarkArea.width / iw, watermarkArea.height / ih) * 1.1;
    const dw = iw * scale, dh = ih * scale;
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.drawImage(
      bgTempleImg,
      watermarkArea.x + (watermarkArea.width - dw) / 2 - 30,
      watermarkArea.y + (watermarkArea.height - dh) / 2,
      dw,
      dh
    );
    ctx.restore();
  }

  // outer gold border + maroon inset frame
  ctx.strokeStyle = palette.border;
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, W - 36, H - 36);
  ctx.strokeStyle = palette.ink;
  ctx.lineWidth = 10;
  ctx.strokeRect(40, 40, W - 80, H - 80);

  // corner brackets
  ctx.strokeStyle = palette.border;
  ctx.lineWidth = 3;
  const cl = 46, off = 26;
  [[off,off,1,1],[W-off,off,-1,1],[off,H-off,1,-1],[W-off,H-off,-1,-1]].forEach(([x,y,dx,dy])=>{
    ctx.beginPath();
    ctx.moveTo(x, y + cl*dy);
    ctx.lineTo(x, y);
    ctx.lineTo(x + cl*dx, y);
    ctx.stroke();
  });

  let y = 108;

  // invocation
  ctx.textAlign = 'center';
  ctx.fillStyle = palette.ink;
  ctx.font = `600 22px "${bodyFont}"`;
  ctx.fillText('🔔  ' + c.invocation + '  🔔', W/2, y);
  y += 30;

  ctx.strokeStyle = palette.border;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(120, y); ctx.lineTo(W-120, y); ctx.stroke();
  y += 66;

  // Receipt reference sits below the top divider, clear of the logo.
  if (state.receiptNo) {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.fillStyle = palette.ink;
    ctx.font = `500 19px "${bodyFont}"`;
    ctx.fillText(`Receipt No: ${state.receiptNo}`, 80, 174, 640);
    ctx.restore();
  }

  // trust line
  ctx.fillStyle = palette.primary;
  ctx.font = `700 34px "${headFont}"`;
  c.trustLine.split('\n').forEach(line => { ctx.fillText(line, W/2, y); y += 42; });
  y += 16;

  // THANK YOU title
  ctx.fillStyle = palette.title;
  ctx.font = `800 56px "${headFont}"`;
  ctx.fillText('🪷 ' + c.title + ' 🪷', W/2, y);
  y += 40;

  ctx.fillStyle = palette.muted;
  ctx.font = `500 22px "${bodyFont}"`;
  wrapText(ctx, c.subtitle, W - 240).forEach(line => { ctx.fillText(line, W/2, y); y += 28; });
  y += 20;

  // decorative emblem circle
  const rad = 92;
  const cx = W/2, cy = y + rad;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, rad, 0, Math.PI*2);
  ctx.fillStyle = palette.soft;
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = palette.border;
  ctx.stroke();
  ctx.clip();
  ctx.font = '84px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🙏', cx, cy + 6);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
  y = cy + rad + 38;

  // donor name
  const displayName = state.name.trim() || 'Donor Name';
  ctx.fillStyle = palette.ink;
  ctx.font = `800 46px "${headFont}"`;
  ctx.fillText(displayName, W/2, y);

  // village, shown under the donor name when it is entered
  const displayVillage = state.village.trim();
  if (displayVillage) {
    y += 28;
    ctx.fillStyle = palette.primary;
    ctx.font = `600 20px "${bodyFont}"`;
    ctx.fillText(displayVillage, W/2, y);
    y += 22;
  } else {
    y += 20;
  }

  // gold divider under name
  ctx.strokeStyle = palette.accent;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2-70, y); ctx.lineTo(W/2+70, y); ctx.stroke();
  y += 20;

  // amount badge
  const amountNum = parseFloat(state.amount);
  if (state.amount && !isNaN(amountNum) && amountNum > 0) {
    const amountStr = `${c.amountLabel}: ₹ ${formatINR(amountNum)}`;
    ctx.font = `700 30px "${bodyFont}"`;
    const tw = ctx.measureText(amountStr).width;
    const padX = 34, badgeH = 58;
    const bw = tw + padX * 2, bx = W/2 - bw/2, by = y;
    ctx.fillStyle = palette.soft;
    roundRect(ctx, bx, by, bw, badgeH, badgeH/2);
    ctx.fill();
    ctx.strokeStyle = palette.border;
    ctx.lineWidth = 2;
    roundRect(ctx, bx, by, bw, badgeH, badgeH/2);
    ctx.stroke();
    ctx.fillStyle = palette.primary;
    ctx.textBaseline = 'middle';
    ctx.fillText(amountStr, W/2, by + badgeH/2 + 2);
    ctx.textBaseline = 'alphabetic';
    y += badgeH + 40;
  }

  const purposeText = state.purpose.trim() || c.defaultPurpose;
  // message
  ctx.fillStyle = palette.text;
  const [messageStart, messageEnd] = c.messages[state.messageIndex](displayName);
  const msgLines = wrapStyledText(ctx, [
    { text: messageStart, bold: false },
    { text: purposeText, bold: true },
    { text: messageEnd, bold: false },
    { text: state.paymentMethod ? ' Your donation was received via' : '', bold: false },
    { text: state.paymentMethod ? `${state.paymentMethod}.` : '', bold: true }
  ], W - 220, bodyFont, 25);
  y = drawStyledTextLines(ctx, msgLines, W / 2, y, 36, bodyFont, 25);

  // Keep the donation date directly above the footer.
  const footH = 165;
  const footerTop = H - 40 - footH;
  const dateStr = formatDate(state.date, 'en-IN', { day:'numeric', month:'long', year:'numeric' });
  ctx.font = `500 19px "${bodyFont}"`;
  ctx.fillStyle = palette.ink;
  ctx.fillText(`${c.dateLabel}: ${dateStr}`, W/2, footerTop - 24);

  // footer band
  ctx.fillStyle = palette.primary;
  ctx.fillRect(40, footerTop, W - 80, footH);

  let fy = footerTop + 30;
  ctx.fillStyle = palette.background;
  ctx.font = `500 20px "${bodyFont}"`;
  c.footerAddr.split('\n').forEach(addressLine => {
    wrapText(ctx, addressLine, W - 200).forEach(line => {
      ctx.fillText(line, W/2, fy);
      fy += 23;
    });
  });

  fy += 8;
  ctx.fillStyle = palette.soft;
  ctx.font = `700 18px "${headFont}"`;
  ctx.fillText(c.dharma, W/2, fy);

  // circular logo image, top right corner (drawn last so it sits above the divider line)
  {
    const logoRad = 82;
    const logoCx = W - 40 - 26 - logoRad + 4;
    const logoCy = 40 + 26 + logoRad - 4;
    ctx.save();
    ctx.beginPath();
    ctx.arc(logoCx, logoCy, logoRad, 0, Math.PI * 2);
    ctx.fillStyle = palette.soft;
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = palette.border;
    ctx.stroke();
    ctx.clip();
    if (logoLoaded) {
      const iw = logoImg.width, ih = logoImg.height;
      const s = Math.max((logoRad * 2) / iw, (logoRad * 2) / ih);
      const dw = iw * s, dh = ih * s;
      ctx.drawImage(logoImg, logoCx - dw / 2, logoCy - dh / 2, dw, dh);
    }
    ctx.restore();
    ctx.strokeStyle = palette.border;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(logoCx, logoCy, logoRad, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// Exclude the current choice so every download leads to a new combination.
function nextRandomIndex(current, count) {
  if (count < 2) return 0;
  const index = Math.floor(Math.random() * (count - 1));
  return index >= current ? index + 1 : index;
}

function randomizeCard() {
  state.paletteIndex = nextRandomIndex(state.paletteIndex, CARD_PALETTES.length);
  state.messageIndex = nextRandomIndex(state.messageIndex, COPY.en.messages.length);
  draw();
}

function lettersAndSpaces(value) {

function downloadCard({ logDonor = false } = {}) {
  if (!receiptNoEl.reportValidity()) return Promise.resolve();
  const donorNameEl = document.getElementById('donorName');

  if (!donorNameEl.reportValidity()) return Promise.resolve();
  if (logDonor && state.name.trim()) {
    return logDonorEntry().then(() => finishCardDownload());
  }
  finishCardDownload();
  return Promise.resolve();
}

function finishCardDownload() {
  const link = document.createElement('a');

  link.download = `thankyou_${safeName}.png`;

  link.click();

  randomizeCard();
  document.getElementById('statusNote').textContent = 'Card downloaded. New color and message ready for the next card.';
}

// --- tiny IndexedDB helper so the file handle survives a page reload ---
// (Chrome/Edge can persist a FileSystemFileHandle this way, so the save
// picker only needs to be shown once, the first time this is used.)
function idbGet(key) {
  return new Promise((resolve) => {
    const req = indexedDB.open('donor-card-app', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('handles', 'readonly');
      const getReq = tx.objectStore('handles').get(key);
      getReq.onsuccess = () => resolve(getReq.result || null);
      getReq.onerror = () => resolve(null);
    };
    req.onerror = () => resolve(null);
  });
}
function idbSet(key, value) {
  return new Promise((resolve) => {
    const req = indexedDB.open('donor-card-app', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    };
    req.onerror = () => resolve(false);
  });
}

function csvEscape(val) {
  const s = String(val ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function buildCSV(list) {
  const header = ['Receipt No', 'Donor Name', 'Village', 'Amount (Rs)', 'Purpose', 'Date of Donation', 'Payment Method'];
  const rows = list.map(r => [r.receiptNo || '', r.name, r.village || '', r.amount || '', r.purpose || '', r.date, r.paymentMethod || '']);
  return [header, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
}

function parseCSVLine(line) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (lines.length < 2) return [];
  const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const column = (...names) => header.findIndex(h => names.includes(h));
  const receiptNoIndex = column('receipt no', 'receipt number');
  const nameIndex = column('donor name', 'name');
  const villageIndex = column('village');
  const amountIndex = column('amount (rs)', 'amount', 'donation amount');
  const paymentMethodIndex = column('payment method', 'payment mode', 'donation method');
  const purposeIndex = column('purpose', 'contribution towards');
  const dateIndex = column('date of donation', 'date');
  return lines.slice(1).map(line => {
    const cols = parseCSVLine(line);
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      receiptNo: cols[receiptNoIndex] || '',
      name: cols[nameIndex === -1 ? 0 : nameIndex] || '',
      village: cols[villageIndex] || '',
      amount: cols[amountIndex] || '',
      paymentMethod: cols[paymentMethodIndex] || '',
      purpose: cols[purposeIndex] || '',
      date: cols[dateIndex] || '',
    };
  });
}

// Gets (and remembers) permission to write straight to donors.csv.
// The OS "choose a file" dialog only appears once — the very first time —
// after that the handle is reused silently, both within this tab and
// (via IndexedDB) across future visits, as long as permission still holds.
async function ensureFileHandle() {
    if (!window.showOpenFilePicker) {
        alert("Your browser does not support automatic CSV updating. Please use Google Chrome or Microsoft Edge.");
        return null;
    }

    if (csvFileHandle) return csvFileHandle;

    const savedHandle = await idbGet("donorsCsvHandle");

    if (savedHandle) {
        const permission = await savedHandle.requestPermission({
            mode: "readwrite"
        });

        if (permission === "granted") {
            csvFileHandle = savedHandle;
            return csvFileHandle;
        }
    }

    try {
        const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{
                description: "CSV File",
                accept: {
                    "text/csv": [".csv"]
                }
            }]
        });

        await handle.requestPermission({
            mode: "readwrite"
        });

        csvFileHandle = handle;

        await idbSet("donorsCsvHandle", handle);

        return handle;

    } catch (e) {
        console.log(e);
        return null;
    }
}

async function logDonorEntry() {

    if (!state.paymentMethod) {
        document.getElementById('statusNote').textContent = 'Choose a mode of payment before saving.';
        return;
    }

    const handle = await ensureFileHandle();

    if (!handle) return;

    // Read latest CSV every time
    let file = await handle.getFile();
    let text = await file.text();

    donorLog = parseCSV(text);

    donorLog.push({
        id: crypto.randomUUID(),
        receiptNo: state.receiptNo,
        name: state.name.trim(),
        village: state.village.trim(),
        amount: state.amount || "",
        paymentMethod: state.paymentMethod,
        purpose: state.purpose || "",
        date: formatDate(state.date, "en-IN", { day: "numeric", month: "short", year: "numeric" })
    });


    const csv = buildCSV(donorLog);

    const writable = await handle.createWritable();

    await writable.write(csv);

    await writable.close();

    document.getElementById("statusNote").textContent =
        "Donor added successfully.";
}

// A download requested from the donor register reuses the saved row and
// deliberately bypasses logDonorEntry(), so no duplicate CSV row is written.
function loadCardFromQuery() {
  const params = new URLSearchParams(window.location.search);
  if (!params.has('name')) return false;

  state.receiptNo = (params.get('receiptNo') || '').replace(/[^0-9]/g, '');
  receiptNoEl.value = state.receiptNo;
  state.nameRaw = lettersAndSpaces(params.get('name') || '');
  state.name = state.nameRaw;
  state.village = lettersAndSpaces(params.get('village') || '');
  state.amount = (params.get('amount') || '').replace(/[^0-9.]/g, '');
  state.paymentMethod = params.get('paymentMethod') || '';
  const requestedPurpose = params.get('purpose') || COPY.en.defaultPurpose;
  state.purpose = Array.from(purposeInputs).some(input => input.value === requestedPurpose)
    ? requestedPurpose
    : 'Other purpose';
  state.date = params.get('date') || localTodayISO();
  document.getElementById('donorName').value = state.nameRaw;
  document.getElementById('village').value = state.village;
  document.getElementById('donorAmount').value = state.amount;
  document.querySelectorAll('input[name="paymentMethod"]').forEach(input => {
    input.checked = input.value === state.paymentMethod;
  });
  donationDateEl.value = state.date;
  purposeInputs.forEach(input => { input.checked = input.value === state.purpose; });
  return params.get('download') === '1';
}
